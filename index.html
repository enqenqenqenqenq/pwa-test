<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecondBrain тест</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B6FD4">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 560px; margin-inline: auto; color: #1F2430; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .row { border: 1px solid #C9CED8; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .row b { display: block; margin-bottom: 4px; }
  button { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #3B6FD4; background: #DCE8FF; margin: 4px 4px 0 0; }
  input { font-size: 16px; padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #C9CED8; border-radius: 8px; }
  ul { padding-left: 18px; margin: 8px 0 0; }
  .ok { color: #1F8F72; } .bad { color: #C0392B; }
</style>
</head>
<body>
<h1>SecondBrain: проверка на телефоне</h1>

<div class="row"><b>1. Установка</b>
  <div id="mode">...</div>
  <button id="install" hidden>Установить приложение</button>
  <div id="iosHint" hidden>На iPhone: Safari, кнопка «Поделиться», затем «На экран Домой».</div>
</div>

<div class="row"><b>2. Работа без интернета</b>
  <div id="net">...</div>
  <div id="sw">...</div>
  <div>Версия страницы: <span id="ver"></span></div>
</div>

<div class="row"><b>3. Хранение записей (IndexedDB)</b>
  <input id="text" placeholder="Напиши мысль и сохрани">
  <button id="save">Сохранить</button>
  <button id="persist">Просить постоянное хранение</button>
  <div id="persistState"></div>
  <ul id="list"></ul>
</div>

<div class="row"><b>4. Уведомления</b>
  <div id="perm">...</div>
  <button id="ask">Разрешить уведомления</button>
  <button id="now">Показать сейчас</button>
  <button id="later">Через 30 секунд</button>
  <div id="notifyState"></div>
</div>

<script>
const $ = id => document.getElementById(id);
$('ver').textContent = 'v1';

// 1. Установка
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
$('mode').innerHTML = standalone
  ? '<span class="ok">Открыто как установленное приложение</span>'
  : 'Открыто во вкладке браузера, не установлено';
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !standalone) $('iosHint').hidden = false;
let deferred;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').hidden = false; });
$('install').onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $('install').hidden = true; } };
addEventListener('appinstalled', () => { $('mode').innerHTML = '<span class="ok">Установлено</span>'; });

// 2. Сеть и service worker
function net() { $('net').innerHTML = navigator.onLine ? '<span class="ok">Интернет есть</span>' : '<span class="bad">Интернета нет</span>'; }
addEventListener('online', net); addEventListener('offline', net); net();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    .then(() => { $('sw').innerHTML = '<span class="ok">Service worker работает, страница сохранена для офлайна</span>'; })
    .catch(e => { $('sw').innerHTML = '<span class="bad">Service worker не запустился: ' + e.message + '</span>'; });
} else { $('sw').innerHTML = '<span class="bad">Service worker не поддерживается</span>'; }

// 3. IndexedDB
const dbReq = indexedDB.open('sb-test', 1);
dbReq.onupgradeneeded = () => dbReq.result.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
function withDb(fn) { return new Promise(res => { if (dbReq.result) res(fn(dbReq.result)); else dbReq.addEventListener('success', () => res(fn(dbReq.result))); }); }
function render() {
  withDb(db => db.transaction('notes').objectStore('notes').getAll().onsuccess = e => {
    $('list').innerHTML = e.target.result.slice().reverse().map(n => '<li>' + new Date(n.t).toLocaleTimeString() + ': ' + n.text.replace(/</g, '&lt;') + '</li>').join('');
  });
}
dbReq.addEventListener('success', render);
$('save').onclick = () => {
  const v = $('text').value.trim(); if (!v) return;
  withDb(db => { db.transaction('notes', 'readwrite').objectStore('notes').add({ text: v, t: Date.now() }).onsuccess = render; });
  $('text').value = '';
};
$('persist').onclick = async () => {
  if (!navigator.storage || !navigator.storage.persist) { $('persistState').textContent = 'Не поддерживается'; return; }
  const ok = await navigator.storage.persist();
  $('persistState').textContent = ok ? 'Постоянное хранение выдано' : 'Браузер отказал (данные могут быть удалены при нехватке места)';
};

// 4. Уведомления
function perm() { $('perm').textContent = 'notification' in window || 'Notification' in window ? 'Разрешение: ' + Notification.permission : 'Уведомления не поддерживаются в этом режиме'; }
if ('Notification' in window) perm(); else $('perm').textContent = 'Уведомления не поддерживаются в этом режиме';
$('ask').onclick = async () => { if ('Notification' in window) { await Notification.requestPermission(); perm(); } };
async function show(title) {
  const reg = await navigator.serviceWorker.ready;
  await reg.showNotification(title, { body: 'Проверка SecondBrain', icon: 'icon-192.png' });
}
$('now').onclick = () => show('Уведомление сразу').catch(e => { $('notifyState').textContent = 'Ошибка: ' + e.message; });
$('later').onclick = () => {
  $('notifyState').textContent = 'Жду 30 секунд. Сверни приложение и посмотри, придёт ли.';
  setTimeout(() => show('Уведомление через 30 секунд').catch(() => {}), 30000);
};
</script>
</body>
</html>
